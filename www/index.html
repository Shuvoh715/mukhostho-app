<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আমার মুখস্থ</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 16px; background: #f4f6fb; }
  h1 { font-size: 22px; }
  textarea { width: 100%; height: 100px; padding: 10px; font-size: 16px; box-sizing: border-box; }
  button { padding: 10px 16px; font-size: 16px; margin-top: 8px; background: #4a6cf7; color: #fff; border: none; border-radius: 6px; }
  .item { background: #fff; padding: 12px; margin-top: 10px; border-radius: 8px; white-space: pre-wrap; }
  .del { background: #e54848; margin-left: 6px; }
</style>
</head>
<body>
<h1>আমার মুখস্থ নোট</h1>
<textarea id="text" placeholder="যা মুখস্থ করছেন তা লিখুন..."></textarea>
<button onclick="addNote()">সংরক্ষণ করুন</button>
<div id="list"></div>
<script>
let notes = JSON.parse(localStorage.getItem('notes') || '[]');
function save() { localStorage.setItem('notes', JSON.stringify(notes)); render(); }
function addNote() {
  const t = document.getElementById('text').value.trim();
  if (!t) return;
  notes.unshift(t);
  document.getElementById('text').value = '';
  save();
}
function removeNote(i) { notes.splice(i, 1); save(); }
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function render() {
  document.getElementById('list').innerHTML = notes.map((n, i) =>
    `<div class="item">${escapeHtml(n)}<br><button class="del" onclick="removeNote(${i})">মুছুন</button></div>`
  ).join('');
}
render();
</script>
</body>
</html>
